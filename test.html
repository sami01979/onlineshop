<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    input, textarea, select { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
    button { background: #000; color: #fff; padding: 10px 20px; border: none; cursor: pointer; width: 100%; }
    #response { margin-top: 20px; padding: 10px; background: #f0f0f0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Add Product</h2>
  <form id="productForm">
    <input type="text" name="name" placeholder="Product name" required /><br>
    <textarea name="description" placeholder="Description" required></textarea><br>
    <input type="number" name="price" placeholder="Price" required /><br>
    <input type="text" name="category" placeholder="Category (e.g. Men)" required /><br>
    <input type="text" name="subCategory" placeholder="Subcategory (e.g. Topwear)" required />
    <input type="text" name="sizes" placeholder='Sizes e.g. ["S","M","L"]' required /><br>
    <select name="bestseller">
      <option value="false">Not Bestseller</option>
      <option value="true">Bestseller</option>
    </select><br>
    <label>Image 1: <input type="file" name="image1" accept="image/*" /></label><br>
    <label>Image 2: <input type="file" name="image2" accept="image/*" /></label><br>
    <label>Image 3: <input type="file" name="image3" accept="image/*" /></label><br>
    <label>Image 4: <input type="file" name="image4" accept="image/*" /></label><br>
    <button type="submit">Add Product</button>
  </form>
  <div id="response"></div>

  <script>
    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const formData = new FormData(e.target)
      const responseDiv = document.getElementById('response')
      responseDiv.textContent = 'Submitting...'
      try {
        const res = await fetch('http://localhost:4000/api/product/add', {
          method: 'POST',
          body: formData
        })
        const data = await res.json()
        responseDiv.textContent = JSON.stringify(data, null, 2)
      } catch (err) {
        responseDiv.textContent = 'Error: ' + err.message
      }
    })
  </script>
</body>
</html>
